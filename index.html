<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ParAvion</title>
    <style>
      html, body { margin: 0; height: 100%; background: #9ec7e8; overflow: hidden; }
      #app { width: 100vw; height: 100vh; }
      canvas { display: block; }
      #hud {
        position: fixed;
        top: 8px;
        left: 8px;
        padding: 6px 10px;
        font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: #fff;
        background: rgba(0, 0, 0, 0.35);
        border-radius: 4px;
        pointer-events: none;
        white-space: pre;
      }
      #controls {
        position: fixed;
        top: 40px;
        left: 8px;
        padding: 6px 10px;
        font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: #fff;
        background: rgba(0, 0, 0, 0.35);
        border-radius: 4px;
      }
      #controls label { display: inline-flex; align-items: center; gap: 6px; }
      #controls input[type="range"] { vertical-align: middle; width: 120px; }
      #radar {
        position: fixed;
        top: 8px;
        right: 8px;
        width: 80px;
        padding: 6px;
        font: 12px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: #fff;
        background: rgba(0, 0, 0, 0.35);
        border-radius: 4px;
        pointer-events: none;
        text-align: center;
        transition: background 200ms ease;
      }
      #radar .box {
        position: relative;
        width: 68px;
        height: 68px;
        margin: 0 auto 4px;
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 4px;
      }
      #radar .box .arrow {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 16px;
        height: 22px;
        margin: -11px 0 0 -8px;
        transform-origin: 50% 50%;
        will-change: transform;
      }
      #radar .box .arrow::before {
        content: '';
        position: absolute;
        left: 0;
        top: 0;
        width: 0;
        height: 0;
        border-left: 8px solid transparent;
        border-right: 8px solid transparent;
        border-bottom: 22px solid #ffdd55;
      }
      #radar .dist { display: block; }
      #radar.found { background: #1c5c2c; }
      #radar.found .box .arrow::before { border-bottom-color: #baffb0; }
      #toast {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 10px 22px;
        font: bold 20px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 2px;
        color: #fff;
        background: rgba(180, 30, 30, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 6px;
        pointer-events: none;
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">pos: (0.0, 0.0, 0.0)  alt: 0 m  fps: 0</div>
    <div id="controls">
      <label>lightning rate <input id="rate" type="range" min="0" max="1" step="0.01" value="0.5" /></label>
    </div>
    <div id="radar">
      <div class="box"><div class="arrow"></div></div>
      <span class="dist">— m</span>
    </div>
    <div id="toast"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
